<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" font-family="system-ui,Segoe UI,sans-serif" role="img" aria-label="An address with :id gives one item"><rect width="800" height="240" rx="18" fill="#faf7f2"/><rect x="40" y="60" width="720" height="50" rx="25" fill="#fff" stroke="#e4ddd2" stroke-width="1.5"/><text x="70" y="92" font-size="18" font-weight="600" fill="#6b6359" text-anchor="start">https://api.example.com/products/</text><rect x="442" y="70" width="56" height="30" rx="15" fill="#fbe0d9" stroke="none" stroke-width="1.5"/><text x="470" y="92" font-size="18" font-weight="800" fill="#e8573a" text-anchor="middle">:id</text><path d="M470 118 L470 148 M474.3148298474378,140.10175694298664 L470 148 L465.6851701525622,140.10175694298664" stroke="#e8573a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="175" font-size="15" font-weight="700" fill="#2b2620" text-anchor="middle">becomes 7 when you open /product/7</text><text x="400" y="224" font-size="14" font-weight="500" fill="#6b6359" text-anchor="middle">Each page shows its own item.</text></svg>
