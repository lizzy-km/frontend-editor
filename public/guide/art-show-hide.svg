<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" font-family="system-ui,Segoe UI,sans-serif" role="img" aria-label="Hide a box for a layer, a screen size or a kind of visitor"><rect width="800" height="240" rx="18" fill="#faf7f2"/><rect x="40" y="30" width="220" height="160" rx="12" fill="#fff" stroke="#e4ddd2" stroke-width="1.5"/><path d="M10 30 q22 -26 44 0 q-22 26 -44 0z" transform="translate(118 44)" fill="none" stroke="#e8573a" stroke-width="3" stroke-linejoin="round"/><text x="150" y="124" font-size="15" font-weight="800" fill="#2b2620" text-anchor="middle">Layers</text><text x="150" y="150" font-size="12" font-weight="500" fill="#6b6359" text-anchor="middle">the eye hides it while you work</text><rect x="290" y="30" width="220" height="160" rx="12" fill="#fff" stroke="#e4ddd2" stroke-width="1.5"/><path d="M12 12 h40 v28 h-40z" transform="translate(368 44)" fill="none" stroke="#e8573a" stroke-width="3" stroke-linejoin="round"/><text x="400" y="124" font-size="15" font-weight="800" fill="#2b2620" text-anchor="middle">Screens</text><text x="400" y="150" font-size="12" font-weight="500" fill="#6b6359" text-anchor="middle">only on phones, tablets…</text><rect x="540" y="30" width="220" height="160" rx="12" fill="#fff" stroke="#e4ddd2" stroke-width="1.5"/><path d="M32 8 a12 12 0 1 0 0.1 0z M12 46 q20 -22 40 0z" transform="translate(618 44)" fill="none" stroke="#e8573a" stroke-width="3" stroke-linejoin="round"/><text x="650" y="124" font-size="15" font-weight="800" fill="#2b2620" text-anchor="middle">Visitors</text><text x="650" y="150" font-size="12" font-weight="500" fill="#6b6359" text-anchor="middle">only for signed-in people</text></svg>
