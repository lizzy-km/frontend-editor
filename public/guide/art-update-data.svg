<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" font-family="system-ui,Segoe UI,sans-serif" role="img" aria-label="A click sends a change to your API for one item, then the card shows the new value"><rect width="800" height="240" rx="18" fill="#faf7f2"/><text x="120" y="32" font-size="13" font-weight="800" fill="#2b2620" text-anchor="middle">A card on your page</text><rect x="30" y="44" width="180" height="150" rx="12" fill="#fff" stroke="#e4ddd2" stroke-width="1.5"/><rect x="46" y="58" width="148" height="44" rx="8" fill="#ece6db"/><text x="46" y="126" font-size="14" font-weight="800" fill="#2b2620">Linen shirt</text><rect x="46" y="144" width="104" height="30" rx="15" fill="#e8573a"/><text x="98" y="164" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Add to favourites</text><path d="M222 160 L330 160 M322 155.5 L330 160 L322 164.5" stroke="#e8573a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="276" y="148" font-size="12" font-weight="700" fill="#6b6359" text-anchor="middle">click</text><text x="440" y="32" font-size="13" font-weight="800" fill="#2b2620" text-anchor="middle">Your API</text><rect x="340" y="44" width="200" height="150" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><text x="356" y="72" font-size="12" font-weight="700" fill="#6d28d9">PATCH /products/7</text><rect x="356" y="86" width="168" height="48" rx="8" fill="#f5f3ff"/><text x="368" y="116" font-size="14" font-weight="700" fill="#2b2620">{ favourite: true }</text><text x="440" y="170" font-size="12" font-weight="500" fill="#6b6359" text-anchor="middle">Only that one item changes</text><path d="M552 160 L650 160 M642 155.5 L650 160 L642 164.5" stroke="#e8573a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="148" font-size="12" font-weight="700" fill="#6b6359" text-anchor="middle">saved</text><text x="710" y="32" font-size="13" font-weight="800" fill="#2b2620" text-anchor="middle">The card now</text><rect x="660" y="44" width="110" height="150" rx="12" fill="#fff" stroke="#e4ddd2" stroke-width="1.5"/><rect x="672" y="58" width="86" height="40" rx="8" fill="#ece6db"/><text x="672" y="122" font-size="13" font-weight="800" fill="#2b2620">Linen shirt</text><rect x="672" y="140" width="86" height="30" rx="15" fill="#16a34a"/><text x="715" y="160" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Favourite ✓</text><text x="400" y="222" font-size="13" font-weight="500" fill="#6b6359" text-anchor="middle">Choose which data to change, which item, and what to set, switch or add.</text></svg>
