<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" font-family="system-ui,Segoe UI,sans-serif" role="img" aria-label="A contact form with a name, an email, a message and a Send button"><rect width="800" height="240" rx="18" fill="#faf7f2"/><rect x="60" y="30" width="320" height="180" rx="12" fill="#fff" stroke="#e4ddd2" stroke-width="1.5"/><rect x="60" y="30" width="320" height="26" rx="12" fill="#ece6db" stroke="none" stroke-width="1.5"/><circle cx="74" cy="43" r="4" fill="#e8573a"/><circle cx="88" cy="43" r="4" fill="#d8d0c4"/><circle cx="102" cy="43" r="4" fill="#d8d0c4"/><rect x="84" y="66" width="272" height="26" rx="8" fill="#ece6db" stroke="none" stroke-width="1.5"/><text x="94" y="84" font-size="12" font-weight="500" fill="#6b6359" text-anchor="start">Your name</text><rect x="84" y="100" width="272" height="26" rx="8" fill="#ece6db" stroke="none" stroke-width="1.5"/><text x="94" y="118" font-size="12" font-weight="500" fill="#6b6359" text-anchor="start">Email</text><rect x="84" y="134" width="272" height="40" rx="8" fill="#ece6db" stroke="none" stroke-width="1.5"/><rect x="84" y="180" width="90" height="30" rx="15" fill="#e8573a" stroke="none" stroke-width="1.5"/><text x="129" y="200" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Send</text><rect x="430" y="40" width="310" height="150" rx="12" fill="#fff" stroke="#e4ddd2" stroke-width="1.5"/><text x="450" y="70" font-size="14" font-weight="800" fill="#2b2620" text-anchor="start">Form settings</text><rect x="450" y="86" width="40" height="22" rx="11" fill="#3f9d6b" stroke="none" stroke-width="1.5"/><text x="500" y="102" font-size="12" font-weight="600" fill="#2b2620" text-anchor="start">Check the answers and send them</text><text x="450" y="140" font-size="12" font-weight="500" fill="#6b6359" text-anchor="start">Send to</text><rect x="450" y="148" width="270" height="26" rx="8" fill="#ece6db" stroke="none" stroke-width="1.5"/></svg>
