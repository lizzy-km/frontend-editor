<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" font-family="system-ui,Segoe UI,sans-serif" role="img" aria-label="A box can require an answer and show your own error message"><rect width="800" height="240" rx="18" fill="#faf7f2"/><rect x="40" y="30" width="340" height="170" rx="12" fill="#fff" stroke="#e4ddd2" stroke-width="1.5"/><text x="60" y="60" font-size="13" font-weight="700" fill="#2b2620" text-anchor="start">Email</text><rect x="60" y="70" width="300" height="32" rx="8" fill="#fff" stroke="#e8573a" stroke-width="2"/><text x="60" y="124" font-size="13" font-weight="600" fill="#e8573a" text-anchor="start">Please type your email address</text><rect x="60" y="150" width="90" height="30" rx="15" fill="#e8573a" stroke="none" stroke-width="1.5"/><text x="105" y="170" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Send</text><path d="M400 115 L450 115 M442.10175694298664,110.68517015256218 L450 115 L442.10175694298664,119.31482984743782" stroke="#e8573a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="460" y="30" width="300" height="170" rx="12" fill="#fff" stroke="#e4ddd2" stroke-width="1.5"/><text x="480" y="60" font-size="14" font-weight="800" fill="#2b2620" text-anchor="start">Rules for this box</text><rect x="480" y="76" width="22" height="22" rx="6" fill="#3f9d6b" stroke="none" stroke-width="1.5"/><text x="512" y="92" font-size="13" font-weight="600" fill="#2b2620" text-anchor="start">Must be filled in</text><rect x="480" y="112" width="22" height="22" rx="6" fill="#3f9d6b" stroke="none" stroke-width="1.5"/><text x="512" y="128" font-size="13" font-weight="600" fill="#2b2620" text-anchor="start">Must be an email</text><rect x="480" y="148" width="22" height="22" rx="6" fill="#3f9d6b" stroke="none" stroke-width="1.5"/><text x="512" y="164" font-size="13" font-weight="600" fill="#2b2620" text-anchor="start">Own error message</text></svg>
