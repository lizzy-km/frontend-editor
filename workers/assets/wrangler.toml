# Cloudflare Worker that stores pictures and page thumbnails in R2.
# Setup: npx wrangler r2 bucket create tweak-assets
#        then set the vars below and run: npm run deploy
name = "tweak-assets"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
FIREBASE_PROJECT_ID = "your-firebase-project-id"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5317"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "tweak-assets"
